name: Notion read-only check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Notion secret is configured
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi
      - name: Read lead records from Notion (read-only)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          NOTION_VERSION: '2026-03-11'
        run: python -m src.notion_reader
